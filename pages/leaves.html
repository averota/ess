<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaves · ESS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/styles.css" rel="stylesheet">
<link href="../assets/css/leaves.css" rel="stylesheet">
</head>
<body data-page="leaves">

<div class="app-shell" id="appShell">
  <div class="app-main">
    <header class="page-topbar">
      <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-expanded="false" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"></path>
        </svg>
      </button>
      <h1 class="page-title">Leaves requests</h1>
    </header>

    <main class="page-content">
      <div class="page-wrap" id="leavesContent" style="display: none;">

        <div class="meta-bar" id="metaBar">
          <div>
            <p class="meta">Submit and track your leave, and review requests from your team.</p>
          </div>
          <div class="btn-group-actions">
            <button type="button" class="btn btn-sm btn-ghost btn-icon" id="refreshListBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
              </svg>
              <span id="refreshListBtnLabel">Refresh</span>
            </button>
            <button type="button" class="btn btn-sm btn-ghost btn-icon hidden" id="manageTypesBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
              Manage leave types
            </button>
            <button type="button" class="btn btn-sm btn-accent btn-icon" id="newRequestBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
              New request
            </button>
          </div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <!-- "My leave" vs "Team requests" tabs, and the request
             filters (Leave type / Year / Status), share one toolbar row
             — reuses .table-toolbar from styles.css to align the
             Filters toggle with the tab header (same flex/
             justify-content: space-between behavior as the employee
             directory's search+filters row). The second tab only
             appears once loadRequests() confirms there's anything in it
             (i.e. I'm someone's supervisor or I'm admin); see
             updateTabBadges() in leaves.js, which also fills the pending
             count pills on both tab titles. -->
        <div class="room-manage-card table-card" id="leavesTabsCard">
          <div class="table-toolbar leaves-tabs-toolbar">
            <ul class="nav nav-tabs leaves-tabs" id="leavesTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="myLeaveTab" data-bs-toggle="tab" data-bs-target="#myLeavePane" type="button" role="tab" aria-controls="myLeavePane" aria-selected="true">
                  My leave
                  <span class="pending-count-pill hidden" id="myRequestsPendingPill"></span>
                </button>
              </li>
              <li class="nav-item hidden" role="presentation" id="otherLeaveTabItem">
                <button class="nav-link" id="otherLeaveTab" data-bs-toggle="tab" data-bs-target="#otherLeavePane" type="button" role="tab" aria-controls="otherLeavePane" aria-selected="false">
                  Team requests
                  <span class="pending-count-pill hidden" id="teamRequestsPendingPill"></span>
                </button>
              </li>
            </ul>

            <button type="button" class="btn btn-ghost btn-sm btn-icon" id="toggleFiltersBtn" data-bs-toggle="collapse" data-bs-target="#filtersCollapse" aria-expanded="false" aria-controls="filtersCollapse">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>
              Filters
              <span class="badge rounded-pill text-bg-secondary d-none" id="activeFilterCount">0</span>
            </button>
          </div>

          <!-- Filter panel: shared by both tabs below (it's one filter
               set applied to the same allRequests fetch — see
               applyFilters() in leaves.js), so it opens directly above
               whichever tab's table is currently showing. -->
          <div class="collapse" id="filtersCollapse">
            <div class="d-flex gap-2 flex-wrap align-items-center px-3 pb-3 pt-1">
              <!-- Leave type: multi-select dropdown (checkboxes) -->
              <div class="dropdown filter-multiselect">
                <button type="button" class="btn btn-outline-secondary btn-sm dropdown-toggle" id="filterLeaveTypeBtn"
                        data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                  Leave type
                </button>
                <div class="dropdown-menu filter-multiselect-menu p-0" id="filterLeaveTypeMenu" aria-labelledby="filterLeaveTypeBtn">
                  <div class="filter-multiselect-header">
                    <span>Leave type</span>
                    <button type="button" class="btn-link-clear" data-clear-target="leaveType">Clear</button>
                  </div>
                  <div class="filter-multiselect-list" id="filterLeaveTypeList"></div>
                </div>
              </div>

              <!-- Year: single-select dropdown, filters by the request's start date. Populated 2025 → current year, defaults to the current year. -->
              <select id="filterYearInput" class="form-select form-select-sm" style="width:auto;"></select>

              <!-- Status: single-select dropdown -->
              <select id="filterStatusInput" class="form-select form-select-sm" style="width:auto;">
                <option value="">All statuses</option>
                <option value="0">Pending</option>
                <option value="1">Approved</option>
                <option value="2">Rejected</option>
                <option value="3">Cancelled</option>
              </select>

              <!-- Employees: single-select dropdown, same behavior as Status. Team requests tab only — leaves.js shows it while that tab is active and fills it with the people who have requests. -->
              <select id="filterEmployeeInput" class="form-select form-select-sm hidden" style="width:auto;" aria-label="Filter by employee">
                <option value="">All employees</option>
              </select>

              <!-- Clears leave type, year, status, and employee at once -->
              <button type="button" class="btn btn-ghost btn-sm btn-icon ms-1" id="clearAllFiltersBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="M6 6l12 12"></path></svg>
                Clear filters
              </button>
            </div>
          </div>
          <div class="tab-content" id="leavesTabContent">
            <div class="tab-pane fade show active" id="myLeavePane" role="tabpanel" aria-labelledby="myLeaveTab">
              <div class="room-manage-card table-card">
                <div class="table-scroll">
                  <table class="data-table" id="myRequestsTable">
                    <thead>
                      <tr>
                        <th>Leave type</th>
                        <th>Dates</th>
                        <th class="days-col">Days</th>
                        <th>Status</th>
                        <th>Reason</th>
                        <th class="actions-col">Action</th>
                      </tr>
                    </thead>
                    <tbody id="myRequestsBody"></tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="tab-pane fade" id="otherLeavePane" role="tabpanel" aria-labelledby="otherLeaveTab">
              <div class="room-manage-card table-card">
                <div class="table-scroll">
                  <table class="data-table" id="teamRequestsTable">
                    <thead>
                      <tr>
                        <th class="employee-col">Employee</th>
                        <th>Leave type</th>
                        <th>Dates</th>
                        <th class="days-col">Days</th>
                        <th>Status</th>
                        <th>Reason</th>
                        <th class="actions-col">Action</th>
                      </tr>
                    </thead>
                    <tbody id="teamRequestsBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

        </div>

      </div>
    </main>
  </div>

  <aside class="app-sidebar" id="sidebarRoot"></aside>
</div>

<!-- New / edit / on-behalf-of leave request -->
<div class="modal fade" id="leaveRequestModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="leaveRequestForm">
        <div class="modal-header">
          <h5 class="modal-title" id="leaveRequestModalTitle">New leave request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

          <div id="onBehalfOfField" class="hidden">
            <label class="form-label" for="requestEmployeeSelect">Requesting for</label>
            <select class="form-select form-select-sm" id="requestEmployeeSelect"></select>
            <p id="onBehalfOfHint" class="mb-0"></p>
          </div>

          <div id="editingForBanner" class="hidden">
            <p id="editingForText" class="mb-0"></p>
          </div>

          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="leaveTypeInput">Leave type <span class="req-text">*</span></label>
              <select class="form-select form-select-sm" id="leaveTypeInput" required></select>
            </div>

            <div class="col-6">
              <label class="form-label" for="startDateInput">Start date <span class="req-text">*</span></label>
              <input type="date" class="form-control form-control-sm" id="startDateInput" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="startHalfDayInput">Start</label>
              <select class="form-select form-select-sm" id="startHalfDayInput">
                <option value="full">Full day</option>
                <option value="am">AM (morning)</option>
                <option value="pm">PM (afternoon)</option>
              </select>
            </div>

            <div class="col-6">
              <label class="form-label" for="endDateInput">End date <span class="req-text">*</span></label>
              <input type="date" class="form-control form-control-sm" id="endDateInput" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="endHalfDayInput">End</label>
              <select class="form-select form-select-sm" id="endHalfDayInput">
                <option value="full">Full day</option>
                <option value="am">AM (morning)</option>
                <option value="pm">PM (afternoon)</option>
              </select>
            </div>

            <div class="col-12">
              <div id="daysPreview"></div>
            </div>

            <div class="col-12">
              <label class="form-label" for="reasonInput">Reason</label>
              <textarea class="form-control form-control-sm" id="reasonInput" rows="3" placeholder="Optional — a short note for your supervisor"></textarea>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-accent btn-sm" id="leaveRequestSubmitBtn">Submit request</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Leave details (opened by a row's View button, or by clicking the row).
     Shows what the compact table row leaves out; the footer actions are
     filled in by openLeaveDetail() in leaves.js. -->
<div class="modal fade" id="leaveDetailModal" tabindex="-1" aria-labelledby="leaveDetailTitle" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <div class="detail-title-wrap">
          <h5 class="modal-title" id="leaveDetailTitle">Leave details</h5>
          <span class="status-badge" id="leaveDetailStatus"></span>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="leaveDetailBody"></div>
      <div class="modal-footer">
        <div class="detail-actions" id="leaveDetailActions"></div>
        <button type="button" class="btn btn-ghost btn-sm" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Manage leave types (admin) -->
<div class="modal fade" id="manageTypesModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Manage leave types</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="lookup-manage-list" id="leaveTypesManageList"></div>
        <div id="newLeaveTypeRow">
          <input type="text" class="form-control form-control-sm" id="newLeaveTypeInput" placeholder="New leave type name">
          <button type="button" class="btn btn-accent btn-sm" id="addLeaveTypeBtn">Add</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost btn-sm" data-bs-dismiss="modal">Done</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/sidebar.js"></script>
<script src="../assets/js/leaves.js"></script>
</body>
</html>
