<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · ESS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>

<nav class="app-nav">
  <div class="nav-inner">
    <span class="brand">ESS</span>
    <div class="d-flex align-items-center gap-3">
      <span class="nav-user" id="userEmail"></span>
      <button class="btn btn-outline-accent btn-sm" id="signOutBtn">Sign out</button>
    </div>
  </div>
</nav>

<main class="dashboard-shell">
  <div class="dashboard-card">
    <div class="success-badge">✓ Signed in</div>
    <h1>You're logged in</h1>
    <p id="welcomeText">Checking your session…</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabaseClient.js"></script>
<script>
  const welcomeText = document.getElementById('welcomeText');

  (async function guard() {
    if (!SUPABASE_CONFIGURED) {
      welcomeText.textContent = "Supabase isn't configured yet — fill in the URL and anon key in assets/js/supabaseClient.js.";
      return;
    }

    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = '../index.html';
      return;
    }

    document.getElementById('userEmail').textContent = session.user.email;

    // Best-effort: if this login is already linked to a row in
    // public.employees (see README for how linking works), greet by name.
    const { data: employee } = await sb
      .from('employees')
      .select('name, employee_id, role')
      .eq('auth_user_id', session.user.id)
      .maybeSingle();

    welcomeText.textContent = employee
      ? `Welcome back, ${employee.name} (${employee.employee_id}).`
      : `Welcome, ${session.user.email}. No employee profile is linked to this login yet — ask your admin to add your email to your employee record.`;
  })();

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = '../index.html';
  });
</script>
</body>
</html>
